<script>
// Auto-hide status message after 5 seconds
document.addEventListener('DOMContentLoaded', () => {
    const msg = document.getElementById('statusMsg');
    if(msg) {
        setTimeout(() => { msg.style.opacity = '0'; setTimeout(() => msg.remove(), 500); }, 5000);
    }

    // Handle "View Plans" click to scroll smoothly without adding #pricing to the URL
    const viewPlansBtn = document.getElementById('viewPlansBtn');
    if (viewPlansBtn) {
        viewPlansBtn.addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('pricing').scrollIntoView({ behavior: 'smooth' });
        });
    }

    const trainerCarousel = document.querySelector('.trainer-carousel');
    if (trainerCarousel) {
        const trainerTrack = trainerCarousel.querySelector('.trainer-track');
        const trainerArrows = trainerCarousel.querySelectorAll('.trainer-arrow');

        trainerArrows.forEach((arrow) => {
            arrow.addEventListener('click', () => {
                const card = trainerTrack.querySelector('.trainer');
                const gap = parseFloat(getComputedStyle(trainerTrack).gap) || 0;
                const direction = Number(arrow.dataset.direction);
                const maxScroll = Math.max(0, trainerTrack.scrollWidth - trainerTrack.clientWidth);
                const atStart = trainerTrack.scrollLeft <= 2;
                const atEnd = trainerTrack.scrollLeft >= maxScroll - 1;
                const target = direction < 0 && atStart
                    ? maxScroll
                    : direction > 0 && atEnd
                        ? 0
                        : Math.max(0, Math.min(maxScroll, trainerTrack.scrollLeft + direction * (card.getBoundingClientRect().width + gap)));

                trainerTrack.scrollTo({
                    left: target,
                    behavior: 'smooth'
                });
            });
        });
    }

    const heroSlider = document.querySelector('.hero-box');
    if (heroSlider) {
        const slides = heroSlider.querySelectorAll('.hero-slide-image');
        const indicators = heroSlider.querySelectorAll('.hero-slide-dot');
        let activeSlide = 0;
        let autoAdvanceTimer;

        const scheduleHeroAdvance = () => {
            clearTimeout(autoAdvanceTimer);
            if (document.hidden || heroSlider.matches(':hover') || heroSlider.contains(document.activeElement)) return;

            autoAdvanceTimer = setTimeout(() => {
                showHeroSlide(activeSlide + 1);
                scheduleHeroAdvance();
            }, 10000);
        };

        const showHeroSlide = (index) => {
            activeSlide = (index + slides.length) % slides.length;
            slides.forEach((slide, slideIndex) => {
                const isActive = slideIndex === activeSlide;
                slide.classList.toggle('is-active', isActive);
                slide.setAttribute('aria-hidden', String(!isActive));
            });
            indicators.forEach((indicator, slideIndex) => {
                const isActive = slideIndex === activeSlide;
                indicator.classList.toggle('is-active', isActive);
                indicator.setAttribute('aria-pressed', String(isActive));
            });
        };

        indicators.forEach((indicator) => {
            indicator.addEventListener('click', () => {
                showHeroSlide(Number(indicator.dataset.slide));
                scheduleHeroAdvance();
            });
        });

        heroSlider.addEventListener('pointerenter', () => clearTimeout(autoAdvanceTimer));
        heroSlider.addEventListener('pointerleave', scheduleHeroAdvance);
        heroSlider.addEventListener('focusin', () => clearTimeout(autoAdvanceTimer));
        heroSlider.addEventListener('focusout', (event) => {
            if (!heroSlider.contains(event.relatedTarget)) scheduleHeroAdvance();
        });
        document.addEventListener('visibilitychange', scheduleHeroAdvance);
        scheduleHeroAdvance();
    }
});
</script>
